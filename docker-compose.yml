services:
  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      WORKSPACE_ROOTS: /workspaces
    volumes:
      - ./data:/data
      - ${WORKSPACE_HOST_ROOT:-./workspaces}:/workspaces
    restart: unless-stopped
